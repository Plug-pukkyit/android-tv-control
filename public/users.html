<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Management - Android TV Controller</title>
  <style>
    :root {
      --bg-dark: #121826;
      --card-bg: #1b2430;
      --accent: #00fff5;
      --primary: #2196f3;
      --danger: #f44336;
      --warning: #ff9800;
      --secondary: #4a5568;
      --text: #ffffff;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .app-container {
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }

    h2 {
      margin-top: 0;
      font-size: 1.2rem;
      color: var(--accent);
      border-bottom: 1px solid #2c3a4e;
      padding-bottom: 10px;
    }

    .form-group {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
      flex-wrap: wrap;
    }

    input, select {
      background-color: #121826;
      border: 1px solid #2c3a4e;
      color: #fff;
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 0.95rem;
      flex: 1;
      min-width: 150px;
    }

    button {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }

    button.danger { background-color: var(--danger); }
    button.warning { background-color: var(--warning); color: #000; }
    button.secondary { background-color: var(--secondary); }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    th, td {
      text-align: left;
      padding: 12px;
      border-bottom: 1px solid #2c3a4e;
    }

    th { color: #a0aec0; font-size: 0.85rem; }

    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.7);
      justify-content: center;
      align-items: center;
      z-index: 999;
    }

    .modal-content {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 10px;
      width: 320px;
    }
  </style>
</head>
<body>

<div class="app-container">

  <div style="display: flex; justify-content: space-between; align-items: center; background: #16213e; padding: 12px 20px; border-radius: 10px;">
    <span>👤 <b>User Management</b></span>
    <div>
      <button class="secondary" onclick="window.location.href='/index.html'">📺 Back to TV Controller</button>
      <button class="danger" onclick="logout()">Logout</button>
    </div>
  </div>

  <div class="card">
    <h2>➕ Add New User</h2>
    <form id="addUserForm" class="form-group">
      <input type="text" id="addUsername" placeholder="Username" required>
      <input type="password" id="addPassword" placeholder="Password" required>
      <select id="addRole" style="max-width: 150px;">
        <option value="admin">Admin</option>
        <option value="operator" selected>Operator</option>
      </select>
      <button type="submit">Add User</button>
    </form>
  </div>

  <div class="card">
    <h2>👥 Existing Users</h2>
    <table>
      <thead>
        <tr>
          <th>Username</th>
          <th>Role</th>
          <th style="text-align: right;">Actions</th>
        </tr>
      </thead>
      <tbody id="userTableBody"></tbody>
    </table>
  </div>

</div>

<!-- Modal สำหรับแก้ไข Password และ Role -->
<div class="modal" id="editUserModal">
  <div class="modal-content">
    <h3 style="margin-top: 0; color: var(--accent);">✏️ Edit User / Password</h3>
    <input type="hidden" id="editUserId">
    <div style="display: flex; flex-direction: column; gap: 12px; margin: 15px 0;">
      <div>
        <label style="font-size: 0.8rem; color: #a0aec0;">Username:</label>
        <input type="text" id="editUsername" placeholder="Username">
      </div>
      <div>
        <label style="font-size: 0.8rem; color: #a0aec0;">New Password (เว้นว่างไว้หากไม่ต้องการเปลี่ยน):</label>
        <input type="password" id="editPassword" placeholder="New Password">
      </div>
      <div>
        <label style="font-size: 0.8rem; color: #a0aec0;">Role:</label>
        <select id="editRole" style="width: 100%;">
          <option value="admin">Admin</option>
          <option value="operator">Operator</option>
        </select>
      </div>
    </div>
    <div style="display: flex; justify-content: flex-end; gap: 10px;">
      <button class="secondary" onclick="closeEditUserModal()">Cancel</button>
      <button onclick="saveEditUser()">Save Changes</button>
    </div>
  </div>
</div>

<script>
  const currentUser = JSON.parse(localStorage.getItem('tv_user') || 'null');
  if (!currentUser) window.location.href = '/login.html';

  async function loadUsers() {
    try {
      const res = await fetch('/api/users');
      const users = await res.json();
      const tbody = document.getElementById('userTableBody');

      tbody.innerHTML = users.map(u => `
        <tr>
          <td><b>${escapeHtml(u.username)}</b></td>
          <td><code>${escapeHtml(u.role)}</code></td>
          <td style="text-align: right;">
            <button class="warning" style="padding: 4px 8px; margin-right: 5px;" onclick="openEditUserModal('${u.id}', '${escapeHtml(u.username)}', '${escapeHtml(u.role)}')">✏️ Edit / Password</button>
            <button class="danger" style="padding: 4px 8px;" onclick="deleteUser('${u.id}')">🗑️ Delete</button>
          </td>
        </tr>
      `).join('');
    } catch (err) {
      alert('Error loading users: ' + err.message);
    }
  }

  function openEditUserModal(id, username, role) {
    document.getElementById('editUserId').value = id;
    document.getElementById('editUsername').value = username;
    document.getElementById('editPassword').value = '';
    document.getElementById('editRole').value = role;
    document.getElementById('editUserModal').style.display = 'flex';
  }

  function closeEditUserModal() {
    document.getElementById('editUserModal').style.display = 'none';
  }

  async function saveEditUser() {
    const id = document.getElementById('editUserId').value;
    const username = document.getElementById('editUsername').value;
    const password = document.getElementById('editPassword').value;
    const role = document.getElementById('editRole').value;

    try {
      const res = await fetch(`/api/users/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password, role })
      });

      if (res.ok) {
        closeEditUserModal();
        alert('User updated successfully!');
        loadUsers();
      } else {
        const data = await res.json();
        alert('Error: ' + data.error);
      }
    } catch (err) {
      alert('Failed to update user: ' + err.message);
    }
  }

  document.getElementById('addUserForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const username = document.getElementById('addUsername').value;
    const password = document.getElementById('addPassword').value;
    const role = document.getElementById('addRole').value;

    try {
      const res = await fetch('/api/users', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password, role })
      });

      if (res.ok) {
        document.getElementById('addUsername').value = '';
        document.getElementById('addPassword').value = '';
        loadUsers();
      } else {
        const data = await res.json();
        alert('Error: ' + data.error);
      }
    } catch (err) {
      alert('Failed to add user: ' + err.message);
    }
  });

  async function deleteUser(id) {
    if (!confirm('Are you sure you want to delete this user?')) return;
    try {
      const res = await fetch(`/api/users/${id}`, { method: 'DELETE' });
      if (res.ok) {
        loadUsers();
      } else {
        const data = await res.json();
        alert('Error: ' + data.error);
      }
    } catch (err) {
      alert('Failed to delete user: ' + err.message);
    }
  }

  function logout() {
    localStorage.removeItem('tv_user');
    window.location.href = '/login.html';
  }

  function escapeHtml(str) {
    return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
  }

  window.onload = loadUsers;
</script>

</body>
</html>
